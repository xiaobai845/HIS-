# 收费小票打印模板
maxrow: 20
rowheight: 22
colwidth: 180
titlefontsize: 18
contentfontsize: 11
top: 30
left: 40
title: 门诊收费小票
fields:
  - patientName:
     title: 患者姓名
     prop: patientName
  - receiptNo:
     title: 收费编号
     prop: receiptNo
  - chargeTime:
     title: 收费时间
     prop: chargeTime
  - itemName:
     title: 项目名称
     prop: itemName
     colwidth: 250
  - unitPrice:
     title: 单价
     prop: unitPrice
  - quantity:
     title: 数量
     prop: quantity
  - amount:
     title: 金额
     prop: amount
  - totalAmount:
     title: 合计
     prop: totalAmount
